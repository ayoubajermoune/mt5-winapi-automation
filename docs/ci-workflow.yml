# GitHub Actions CI for mt5-winapi-automation.
#
# NOTE: this file lives in docs/ because the repository was created via the
# GitHub contents API, which cannot write .github/workflows/* without the
# "workflow" token scope. To activate: move it to .github/workflows/ci.yml
# (git mv docs/ci-workflow.yml .github/workflows/ci.yml && git push).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run identifier-table tests
        run: python -m unittest discover -s tests -v
      - name: Syntax-check Win32 modules
        if: runner.os == 'Linux'
        run: python -m py_compile mt5auto/*.py tools/*.py examples/*.py
